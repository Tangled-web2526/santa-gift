<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🎅 Your Secret Santa Reveal! 🎁</title>
  <!-- Confetti Canvas Library -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: radial-gradient(circle at top, #ffffff, #f0f4f8, #e2e8f0);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #2c3e50;
      overflow: hidden;
      text-align: center;
      padding: 20px;
      position: relative;
    }

    /* Falling Snowflakes Layer */
    .snowflake {
      position: fixed;
      top: -10px;
      color: #94a3b8;
      font-size: 1.2rem;
      user-select: none;
      z-index: 1;
      pointer-events: none;
      animation-name: fall;
      animation-timing-function: linear;
      animation-iteration-count: infinite;
      opacity: 0.8;
    }
    @keyframes fall {
      0% {
        top: -10%;
        transform: translateX(0) rotate(0deg);
      }
      100% {
        top: 105%;
        transform: translateX(50px) rotate(360deg);
      }
    }

    /* Header & Instructions */
    .content-wrapper {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    h1 {
      font-size: 2.2rem;
      margin-bottom: 8px;
      color: #c0392b;
      font-weight: 800;
      letter-spacing: -0.5px;
      text-shadow: 0 2px 10px rgba(192, 57, 43, 0.15);
    }
    p.instruction {
      font-size: 1.1rem;
      color: #4a5568;
      margin-bottom: 35px;
      font-weight: 500;
    }

    /* Gift Box Wrapper */
    .gift-container {
      position: relative;
      cursor: pointer;
      width: 180px;
      height: 180px;
      margin: 0 auto 30px auto;
      transition: transform 0.25s ease;
    }
    .gift-container:hover {
      transform: scale(1.06);
    }

    /* Gift Box Body */
    .box {
      position: absolute;
      bottom: 0;
      width: 180px;
      height: 130px;
      background: linear-gradient(135deg, #e74c3c, #c0392b);
      border-radius: 0 0 14px 14px;
      box-shadow: 0 14px 30px rgba(192, 57, 43, 0.25), 0 4px 8px rgba(0, 0, 0, 0.08);
      border: 3px solid #ff7979;
    }
    /* Gold Ribbons on Box */
    .box::before {
      content: '';
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      width: 36px;
      height: 100%;
      background: linear-gradient(to right, #f39c12, #f1c40f, #f39c12);
      box-shadow: 0 0 4px rgba(0,0,0,0.1);
    }

    /* Gift Box Lid */
    .lid {
      position: absolute;
      top: 18px;
      left: -10px;
      width: 200px;
      height: 42px;
      background: linear-gradient(135deg, #d63031, #b71540);
      border-radius: 9px;
      box-shadow: 0 6px 15px rgba(0, 0, 0, 0.15);
      z-index: 2;
      border: 3px solid #ff7979;
      transition: transform 0.65s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.4s;
    }
    /* Gold Ribbon on Lid */
    .lid::before {
      content: '';
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      width: 36px;
      height: 100%;
      background: linear-gradient(to right, #f39c12, #f1c40f, #f39c12);
    }
    /* Ribbon Bow */
    .bow {
      position: absolute;
      top: -24px;
      left: 50%;
      transform: translateX(-50%);
      width: 50px;
      height: 24px;
      background: linear-gradient(to bottom, #f1c40f, #f39c12);
      border-radius: 50% 50% 0 0;
      box-shadow: 0 2px 5px rgba(0,0,0,0.15);
    }

    /* Animation on Open */
    .opened .lid {
      transform: translateY(-95px) rotate(-18deg);
      opacity: 0.85;
    }
    .opened .gift-container {
      pointer-events: none;
    }

    /* Revealed Target Card */
    .result-card {
      opacity: 0;
      transform: scale(0.6) translateY(20px);
      transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      background: #ffffff;
      color: #2d3748;
      padding: 28px 36px;
      border-radius: 20px;
      border: 2px solid #edf2f7;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.12), 0 1px 3px rgba(0, 0, 0, 0.05);
      max-width: 440px;
      width: 90%;
      position: relative;
      z-index: 20;
    }
    .result-card.show {
      opacity: 1;
      transform: scale(1) translateY(0);
    }
    .result-card h3 {
      font-size: 1.05rem;
      color: #718096;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      font-weight: 600;
    }
    .result-card .name {
      font-size: 2.2rem;
      font-weight: 800;
      color: #c0392b;
      margin-bottom: 14px;
      letter-spacing: -0.5px;
    }
    .result-card .tip {
      font-size: 0.95rem;
      color: #4a5568;
      line-height: 1.5;
      background: #f8fafc;
      padding: 12px;
      border-radius: 12px;
      border: 1px dashed #cbd5e1;
    }
  </style>
</head>
<body>

  <!-- Falling Snowflakes Container -->
  <div id="snowflakes-container"></div>

  <div class="content-wrapper">
    <h1>🎅 Secret Santa Reveal! 🎁</h1>
    <p class="instruction" id="subtext">Tap on the gift box to unwrap your secret match!</p>

    <div class="gift-container" id="gift" onclick="openBox()">
      <div class="lid">
        <div class="bow"></div>
      </div>
      <div class="box"></div>
    </div>

    <div class="result-card" id="card">
      <h3>You are the Secret Santa for:</h3>
      <div class="name" id="receiverName">Loading...</div>
      <div class="tip">
        🤫 <b>Shh... Keep it a total secret!</b><br>
        📅 Exchange Date: <b>Dec 18th (3:00 - 6:00 PM)</b><br>
        💰 Budget: <b>INR 500 – INR 1,000</b>
      </div>
    </div>
  </div>

  <script>
    // 1. Generate gentle falling snowflakes dynamically
    const snowIcons = ['❄', '❅', '❆', '•'];
    const snowContainer = document.getElementById('snowflakes-container');
    const snowflakeCount = 35;

    for (let i = 0; i < snowflakeCount; i++) {
      const flake = document.createElement('div');
      flake.className = 'snowflake';
      flake.textContent = snowIcons[Math.floor(Math.random() * snowIcons.length)];
      flake.style.left = Math.random() * 100 + 'vw';
      flake.style.animationDuration = (Math.random() * 5 + 6) + 's'; // 6s - 11s duration
      flake.style.animationDelay = (Math.random() * 5) + 's';
      flake.style.fontSize = (Math.random() * 1.1 + 0.8) + 'rem';
      flake.style.opacity = Math.random() * 0.7 + 0.3;
      snowContainer.appendChild(flake);
    }

    // 2. Decode name safely from URL parameter (?k=...)
    function getReceiverName() {
      const urlParams = new URLSearchParams(window.location.search);
      const val = urlParams.get('k');
      if (!val) return "A Wonderful Colleague! 🎄";
      try {
        // Try Base64 decode with UTF-8
        return decodeURIComponent(escape(atob(val)));
      } catch (e) {
        // Fallback to plain text
        return decodeURIComponent(val);
      }
    }

    document.getElementById('receiverName').textContent = getReceiverName();

    // 3. Open Box, Trigger Confetti & Reveal Card
    let isOpen = false;
    function openBox() {
      if (isOpen) return;
      isOpen = true;

      document.body.classList.add('opened');
      document.getElementById('subtext').textContent = "🎉 Ho Ho Ho! Your match is revealed! 🎉";

      // Festive Confetti burst (Gold, Red, Green, White)
      confetti({
        particleCount: 140,
        spread: 85,
        origin: { y: 0.6 },
        colors: ['#f1c40f', '#e74c3c', '#27ae60', '#3498db']
      });

      // Pop the card out
      setTimeout(() => {
        document.getElementById('card').classList.add('show');
      }, 350);
    }
  </script>
</body>
</html>
