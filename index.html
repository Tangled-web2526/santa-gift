<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🎅 Your Secret Santa Reveal! 🎁</title>
  <!-- Confetti Canvas Library -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: radial-gradient(circle at center, #c0392b, #781d14);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #fff;
      overflow: hidden;
      text-align: center;
      padding: 20px;
    }
    h1 {
      font-size: 2.2rem;
      margin-bottom: 8px;
      text-shadow: 0 2px 8px rgba(0,0,0,0.4);
    }
    p.instruction {
      font-size: 1.1rem;
      opacity: 0.9;
      margin-bottom: 40px;
    }

    /* Gift Box Wrapper */
    .gift-container {
      position: relative;
      cursor: pointer;
      width: 180px;
      height: 180px;
      margin: 0 auto 30px auto;
      transition: transform 0.2s;
    }
    .gift-container:hover {
      transform: scale(1.05);
    }

    /* Gift Box Body */
    .box {
      position: absolute;
      bottom: 0;
      width: 180px;
      height: 130px;
      background: #e74c3c;
      border-radius: 0 0 12px 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
      border: 3px solid #ff7979;
    }
    /* Gold Ribbon on Box */
    .box::before {
      content: '';
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      width: 35px;
      height: 100%;
      background: #f1c40f;
    }

    /* Gift Box Lid */
    .lid {
      position: absolute;
      top: 20px;
      left: -10px;
      width: 200px;
      height: 40px;
      background: #c0392b;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
      z-index: 2;
      border: 3px solid #ff7979;
      transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.4s;
    }
    /* Gold Ribbon on Lid */
    .lid::before {
      content: '';
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      width: 35px;
      height: 100%;
      background: #f1c40f;
    }
    /* Ribbon Bow */
    .bow {
      position: absolute;
      top: -24px;
      left: 50%;
      transform: translateX(-50%);
      width: 48px;
      height: 24px;
      background: #f1c40f;
      border-radius: 50% 50% 0 0;
    }

    /* Animation on Open */
    .opened .lid {
      transform: translateY(-90px) rotate(-15deg);
      opacity: 0.8;
    }
    .opened .gift-container {
      pointer-events: none;
    }

    /* Revealed Target Card */
    .result-card {
      opacity: 0;
      transform: scale(0.6);
      transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      background: #ffffff;
      color: #333;
      padding: 25px 35px;
      border-radius: 16px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.35);
      max-width: 420px;
      width: 90%;
    }
    .result-card.show {
      opacity: 1;
      transform: scale(1);
    }
    .result-card h3 {
      font-size: 1.1rem;
      color: #7f8c8d;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .result-card .name {
      font-size: 2rem;
      font-weight: 800;
      color: #c0392b;
      margin-bottom: 15px;
    }
    .result-card .tip {
      font-size: 0.95rem;
      color: #555;
      line-height: 1.4;
    }
  </style>
</head>
<body>

  <h1>🎅 Secret Santa Reveal! 🎁</h1>
  <p class="instruction" id="subtext">Tap on the gift box to unwrap your secret match!</p>

  <div class="gift-container" id="gift" onclick="openBox()">
    <div class="lid">
      <div class="bow"></div>
    </div>
    <div class="box"></div>
  </div>

  <div class="result-card" id="card">
    <h3>You are the Secret Santa for:</h3>
    <div class="name" id="receiverName">Loading...</div>
    <p class="tip">🤫 <b>Shh... Keep it a total secret!</b><br>
    Exchange Date: <b>Dec 18th (3:00 - 6:00 PM)</b><br>
    Budget: <b>INR 500 – INR 1,000</b></p>
  </div>

  <script>
    // 1. Decode name from URL parameter (?k=...)
    function getReceiverName() {
      const urlParams = new URLSearchParams(window.location.search);
      const val = urlParams.get('k');
      if (!val) return "A Wonderful Colleague! 🎄";
      try {
        // Try Base64 decode
        return decodeURIComponent(escape(atob(val)));
      } catch (e) {
        // Fallback to plain text if not Base64
        return decodeURIComponent(val);
      }
    }

    document.getElementById('receiverName').textContent = getReceiverName();

    // 2. Open Box, Trigger Fireworks & Show Name
    let isOpen = false;
    function openBox() {
      if (isOpen) return;
      isOpen = true;

      document.body.classList.add('opened');
      document.getElementById('subtext').textContent = "🎉 Ho Ho Ho! Your match is revealed! 🎉";

      // Confetti burst
      confetti({
        particleCount: 120,
        spread: 80,
        origin: { y: 0.6 },
        colors: ['#f1c40f', '#e74c3c', '#ffffff', '#2ecc71']
      });

      // Pop the card out
      setTimeout(() => {
        document.getElementById('card').classList.add('show');
      }, 350);
    }
  </script>
</body>
</html>
